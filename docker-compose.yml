services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${OPENSEARCH_PASS}
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u elastic:\"$$ELASTIC_PASSWORD\" http://127.0.0.1:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  multivac:
    build: .
    env_file: .env
    environment:
      # container-local overrides: ES lives in the sibling container, plain HTTP
      - OPENSEARCH_HOST=http://elasticsearch:9200
      - OPENSEARCH_VERIFY_CERTS=false
    volumes:
      - .:/app
    depends_on:
      - elasticsearch
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    restart: unless-stopped

volumes:
  esdata:
